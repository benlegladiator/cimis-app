spring.application.name=siadoc-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drh_militaire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.transaction.jta.platform=none

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.sql.init.mode=never

# server.port retiré pour laisser Render gérer via -Dserver.port

# TOMCAT CONFIG
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-parameter-count=10000

# CONFIGURATION RÉACTIVÉE POUR RENDER (HTTPS)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# OPTIMISATION POUR RENDER INTERNAL DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# LIMITES DE TÉLÉVERSEMENT (MULTIPART)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CONFIGURATION API CIMIS - TENTATIVE HTTP (Anti-Bot Bypass)
cimis.api.base-url=http://cimis.ct.ws/backend/api_siadoc_envoie.php
cimis.api.key=siadoc-2026-cimis-integration

# Timeout configuration
cimis.api.connect-timeout=10000
cimis.api.read-timeout=10000

# Logging
logging.level.com.siadoc.backend.service.CimisClientService=DEBUG
